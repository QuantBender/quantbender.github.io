repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: >
          ^(docs/|_site/|\.quarto/_freeze/|_freeze/|\.Rproj.user/|.*\.(png|jpg|jpeg|webp|gif)$)
      - id: end-of-file-fixer
        exclude: >
          ^(docs/|_site/|\.quarto/_freeze/|_freeze/|\.Rproj.user/|.*\.(png|jpg|jpeg|webp|gif)$)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: >
          ^(docs/.*\.(png|jpg|jpeg|webp|gif)|.*\.(ico|svg)|docs/site_libs/)
